<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="62" fill="url(#cyberGlow)"/>

  <!-- Outer Cyber Hexagon Base -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" fill="url(#darkBg)" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Cyber Circuit Border -->
  <polygon points="64,16 108,40 108,88 64,112 20,88 20,40" fill="none" stroke="#00ff66" stroke-width="1.2" stroke-dasharray="8, 3" opacity="0.7"/>

  <!-- Circuit nodes -->
  <circle cx="64" cy="16" r="3" fill="#00ff66"/>
  <circle cx="108" cy="40" r="3" fill="#00e5ff"/>
  <circle cx="108" cy="88" r="3" fill="#00ff66"/>
  <circle cx="64" cy="112" r="3" fill="#00e5ff"/>
  <circle cx="20" cy="88" r="3" fill="#00ff66"/>
  <circle cx="20" cy="40" r="3" fill="#00e5ff"/>

  <!-- Central 'V' Stylized Cyberpunk Logo -->
  <path d="M38 38 L64 88 L90 38 L76 38 L64 64 L52 38 Z" fill="url(#neonGreenGrad)"/>

  <!-- Command Center Core Lightning Glyph -->
  <polygon points="65,34 56,52 64,52 61,68 72,50 64,50" fill="#00e5ff" stroke="#0a0b10" stroke-width="1"/>
</svg>

